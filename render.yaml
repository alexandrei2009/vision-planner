databases:
  - name: vision-planner-db
    plan: free
    databaseName: vision_planner
    user: vision_planner

services:
  - type: web
    name: vision-planner
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vision-planner-db
          property: connectionString
